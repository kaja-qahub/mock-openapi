openapi: 3.0.0
info:
  title: Multi Resource API
  version: 1.0.0

servers:
  - url: https://your-backend-url.com

paths:
  /users:
    get:
      operationId: getUsers
      responses:
        '200':
          description: Success

  /users/{id}:
    get:
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

  /products:
    get:
      operationId: getProducts
      responses:
        '200':
          description: Success
