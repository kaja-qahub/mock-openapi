swagger: "2.0"

info:
  title: Users API - All HTTP Methods
  description: API specification for testing GET, POST, PUT, PATCH and DELETE methods.
  version: "1.0.0"

host: 35.207.4.105:7000
basePath: /
schemes:
  - http

produces:
  - application/json

paths:

  /users:

    get:
      summary: Get users
      description: Retrieve users.
      operationId: getUsers
      produces:
        - application/json

      responses:
        "200":
          description: Users retrieved successfully
          schema:
            type: array
            items:
              $ref: "#/definitions/User"

        "500":
          description: Internal server error


    post:
      summary: Create a user
      description: Creates a new user.
      operationId: createUser
      produces:
        - application/json

      responses:
        "200":
          description: User created successfully
          schema:
            type: object
            required:
              - message
              - data
            properties:
              message:
                type: string
                example: "User created"

              data:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1790090089915

        "500":
          description: Internal server error


  /users/{userId}:

    get:
      summary: Get user by ID
      description: Retrieve a specific user using the user ID.
      operationId: getUserById
      produces:
        - application/json

      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          format: int64
          description: Unique identifier of the user.
          example: 1790056782082

      responses:
        "200":
          description: User retrieved successfully
          schema:
            $ref: "#/definitions/User"

        "404":
          description: User not found

        "500":
          description: Internal server error


    put:
      summary: Update a user
      description: Updates an existing user.
      operationId: updateUser
      produces:
        - application/json

      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          format: int64
          description: Unique identifier of the user.
          example: 1790056782082

      responses:
        "200":
          description: User updated successfully
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
                format: int64
                example: 1790056782082

        "404":
          description: User not found

        "500":
          description: Internal server error


    patch:
      summary: Partially update a user
      description: Updates an existing user.
      operationId: patchUser

      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          format: int64
          description: Unique identifier of the user.
          example: 1790056782082

      responses:
        "200":
          description: User patched successfully

        "404":
          description: User not found

        "500":
          description: Internal server error


    delete:
      summary: Delete a user
      description: Deletes a user using the user ID.
      operationId: deleteUser

      parameters:
        - name: userId
          in: path
          required: true
          type: integer
          format: int64
          description: Unique identifier of the user.
          example: 1790056782082

      responses:
        "200":
          description: User deleted successfully
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                example: "User deleted"

        "404":
          description: User not found

        "500":
          description: Internal server error


definitions:

  User:
    type: object
    required:
      - id

    properties:

      id:
        type: integer
        format: int64
        example: 1

      name:
        type: string
        example: "John"

      email:
        type: string
        example: "john@example.com"

      phone:
        type: string
        example: "0771234567"
