swagger: "2.0"

info:
  title: Gateway Backend Error API
  description: API used to validate Gateway handling of backend errors
  version: "1.0.0"

host: mock.example.com
basePath: /api
schemes:
  - https

paths:

  /customers:
    get:
      summary: Get customers - backend error
      description: Endpoint intentionally returns HTTP 500 for Gateway error validation
      operationId: getCustomersBackendError
      produces:
        - application/json

      responses:
        "200":
          description: Successful response
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string

        "500":
          description: Backend Internal Server Error
          schema:
            type: object
            properties:
              error:
                type: string
              status:
                type: integer
              message:
                type: string
