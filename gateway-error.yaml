openapi: 3.0.0

info:
  title: Gateway Backend Error API
  description: API used to validate MCP Gateway handling of backend errors
  version: 1.0.0

servers:
  - url: http://35.207.4.105:9098

paths:
  /errors/500:
    get:
      operationId: getCustomersBackendError
      summary: Simulate backend 500 error
      description: Endpoint intentionally returns HTTP 500 from the backend
      responses:
        "500":
          description: Backend Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  status:
                    type: integer
                  message:
                    type: string
