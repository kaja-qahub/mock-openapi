openapi: 3.0.3
info:
  title: Customer Orders API
  version: 1.0.0
  description: Sample API demonstrating nested resource paths.

servers:
  - url: https://api.example.com

paths:
  /customers/{customerId}/orders/{orderId}:
    get:
      summary: Get a specific order for a customer
      operationId: getCustomerOrder
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        status:
          type: string
        amount:
          type: number
          format: double